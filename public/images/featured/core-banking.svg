<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#090e1a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="180" r="140" fill="#8b5cf6" opacity="0.22" filter="url(#blurFilter)" />
  <circle cx="620" cy="300" r="150" fill="#06b6d4" opacity="0.2" filter="url(#blurFilter)" />

  <!-- Architectural Grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Central Enterprise Ledger Hub -->
  <g transform="translate(180, 70)">
    <!-- Main Glassmorphic Panel -->
    <rect x="0" y="0" width="440" height="280" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    
    <!-- Top Terminal Header -->
    <rect x="0" y="0" width="440" height="42" rx="16" fill="rgba(255,255,255,0.03)" />
    <circle cx="22" cy="21" r="5" fill="#ef4444" opacity="0.7" />
    <circle cx="38" cy="21" r="5" fill="#f59e0b" opacity="0.7" />
    <circle cx="54" cy="21" r="5" fill="#10b981" opacity="0.7" />
    <text x="75" y="25" fill="#94a3b8" font-family="monospace" font-size="11" letter-spacing="1">DEARO_CORE_BANKING_ENGINE // v4.2</text>
    
    <!-- Confidential Status Pill -->
    <rect x="330" y="12" width="94" height="20" rx="10" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" />
    <text x="345" y="25" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="bold">CONFIDENTIAL</text>

    <!-- Balance &amp; Transaction Metrics -->
    <text x="28" y="76" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">LEDGER AGGREGATE VOLUME</text>
    <text x="28" y="112" fill="#ffffff" font-family="sans-serif" font-size="30" font-weight="bold" letter-spacing="-0.5">$248,890,410.00</text>
    <text x="320" y="110" fill="#10b981" font-family="monospace" font-size="13" font-weight="bold">▲ 99.999% SLA</text>

    <!-- Node Connection Diagram -->
    <g transform="translate(28, 140)">
      <rect x="0" y="0" width="115" height="90" rx="10" fill="rgba(139, 92, 246, 0.12)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1" />
      <text x="14" y="24" fill="#c4b5fd" font-family="monospace" font-size="10">AUTH NODE 01</text>
      <text x="14" y="48" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">ACID TX</text>
      <text x="14" y="70" fill="#10b981" font-family="monospace" font-size="10">● Encrypted</text>

      <line x1="115" y1="45" x2="135" y2="45" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3,3" />

      <rect x="135" y="0" width="115" height="90" rx="10" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
      <text x="149" y="24" fill="#67e8f9" font-family="monospace" font-size="10">GATEWAY 02</text>
      <text x="149" y="48" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">SETTLEMENT</text>
      <text x="149" y="70" fill="#06b6d4" font-family="monospace" font-size="10">● Validated</text>

      <line x1="250" y1="45" x2="270" y2="45" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3" />

      <rect x="270" y="0" width="115" height="90" rx="10" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      <text x="284" y="24" fill="#6ee7b7" font-family="monospace" font-size="10">LEDGER SYNC</text>
      <text x="284" y="48" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">AUDIT LOG</text>
      <text x="284" y="70" fill="#10b981" font-family="monospace" font-size="10">● Synchronous</text>
    </g>
  </g>

  <!-- Floating Holographic Shield Badge -->
  <g transform="translate(620, 100)">
    <circle cx="40" cy="40" r="36" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.4)" stroke-width="1.5" />
    <path d="M40 22 L55 28 V43 C55 52 48 59 40 62 C32 59 25 52 25 43 V28 Z" fill="none" stroke="#a78bfa" stroke-width="2" />
    <path d="M33 41 L38 46 L47 36" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Bottom Data Stream Bar -->
  <rect x="80" y="400" width="640" height="34" rx="17" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.1)" />
  <circle cx="102" cy="417" r="4" fill="#10b981" />
  <text x="118" y="421" fill="#94a3b8" font-family="monospace" font-size="10">
    SYSTEM HEALTH: 100% OPERATIONAL | ZERO TRANSACTIONS DROPPED | REST ENCRYPTED SHA-256
  </text>
</svg>

