<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d1a" />
      <stop offset="60%" stop-color="#06182e" />
      <stop offset="100%" stop-color="#020914" />
    </linearGradient>
    <linearGradient id="medCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="medBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#medBg)" />

  <circle cx="200" cy="140" r="160" fill="#06b6d4" opacity="0.18" filter="url(#medBlur)" />
  <circle cx="650" cy="340" r="160" fill="#10b981" opacity="0.15" filter="url(#medBlur)" />

  <!-- Center Composite: Healthcare Dashboard &amp; Prescription Card -->
  <g transform="translate(70, 50)">
    <!-- Main Admin Dashboard Frame -->
    <rect width="660" height="370" rx="18" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

    <!-- Top Bar -->
    <rect width="660" height="48" rx="18" fill="rgba(255,255,255,0.03)" />
    <circle cx="26" cy="24" r="4.5" fill="#ef4444" opacity="0.7" />
    <circle cx="42" cy="24" r="4.5" fill="#f59e0b" opacity="0.7" />
    <circle cx="58" cy="24" r="4.5" fill="#10b981" opacity="0.7" />
    
    <text x="82" y="28" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">HC HOME ADMIN // WHERE IS MY DOCTOR</text>
    <text x="460" y="28" fill="#10b981" font-family="monospace" font-size="11">● REALTIME SYNC ACTIVE</text>

    <!-- Left Stats &amp; Queue Panel -->
    <g transform="translate(30, 75)">
      <text x="0" y="16" fill="#94a3b8" font-family="monospace" font-size="10">ACTIVE CLINICAL QUEUE</text>
      <text x="0" y="48" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="bold">142 Consultations</text>

      <!-- Pulse Waveform Box -->
      <g transform="translate(0, 75)">
        <rect width="260" height="95" rx="12" fill="rgba(6,182,212,0.06)" stroke="rgba(6,182,212,0.2)" />
        <text x="16" y="24" fill="#38bdf8" font-family="monospace" font-size="10">ECG &amp; TELEMETRY STREAM</text>
        <!-- Heartbeat Line -->
        <path d="M 16 60 L 60 60 L 75 40 L 90 75 L 105 25 L 120 70 L 130 60 L 180 60 L 195 45 L 205 70 L 215 60 L 244 60" fill="none" stroke="url(#medCyan)" stroke-width="2.5" stroke-linecap="round" />
        <circle cx="244" cy="60" r="4" fill="#10b981" />
      </g>

      <!-- Doctor Slots Status -->
      <g transform="translate(0, 190)">
        <rect width="260" height="75" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
        <text x="16" y="26" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Practitioner Availability</text>
        <text x="16" y="52" fill="#10b981" font-family="monospace" font-size="14" font-weight="bold">28 Doctors On-Duty</text>
      </g>
    </g>

    <!-- Right: e-Prescription Floating Card -->
    <g transform="translate(330, 75)">
      <rect width="295" height="260" rx="14" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" />

      <!-- Prescription Header -->
      <rect width="295" height="42" rx="14" fill="rgba(6, 182, 212, 0.12)" />
      <text x="20" y="26" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">℞ DIGITAL PRESCRIPTION GENERATOR</text>

      <g transform="translate(20, 60)">
        <text x="0" y="16" fill="#64748b" font-family="sans-serif" font-size="10">PATIENT ID</text>
        <text x="0" y="32" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">#PT-8940-LK</text>

        <text x="140" y="16" fill="#64748b" font-family="sans-serif" font-size="10">DIAGNOSIS CATEGORY</text>
        <text x="140" y="32" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">Cardiology Routine</text>

        <!-- Dosage Table -->
        <g transform="translate(0, 52)">
          <rect width="255" height="40" rx="8" fill="rgba(255,255,255,0.03)" />
          <text x="12" y="24" fill="#f8fafc" font-family="sans-serif" font-size="11">Amoxicillin 500mg • BID (7 Days)</text>

          <rect y="48" width="255" height="40" rx="8" fill="rgba(255,255,255,0.03)" />
          <text x="12" y="72" fill="#f8fafc" font-family="sans-serif" font-size="11">Atorvastatin 20mg • Night (30 Days)</text>
        </g>

        <!-- Signature Verification -->
        <g transform="translate(0, 160)">
          <text x="0" y="16" fill="#10b981" font-family="monospace" font-size="10">✓ VERIFIED BY LICENSED PHYSICIAN</text>
          <text x="0" y="30" fill="#64748b" font-family="monospace" font-size="9">SLMC REGISTRATION: #48190-SRI LANKA</text>
        </g>
      </g>
    </g>
  </g>
</svg>

