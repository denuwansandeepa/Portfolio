<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="dvcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="60%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="dvcBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#dvcBg)" />

  <circle cx="680" cy="120" r="160" fill="#06b6d4" opacity="0.18" filter="url(#dvcBlur)" />
  <circle cx="140" cy="380" r="150" fill="#8b5cf6" opacity="0.15" filter="url(#dvcBlur)" />

  <!-- Main Corporate Window -->
  <g transform="translate(60, 40)">
    <rect width="680" height="380" rx="18" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

    <!-- Top Navigation Bar -->
    <rect width="680" height="50" rx="18" fill="rgba(255,255,255,0.03)" />
    <circle cx="28" cy="25" r="4.5" fill="#ef4444" opacity="0.7" />
    <circle cx="44" cy="25" r="4.5" fill="#f59e0b" opacity="0.7" />
    <circle cx="60" cy="25" r="4.5" fill="#10b981" opacity="0.7" />
    
    <text x="85" y="30" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">DVCCL</text>
    <text x="145" y="29" fill="#64748b" font-family="sans-serif" font-size="11">DEVELOPMENT VENTURE CAPITAL CORPORATION</text>
    
    <rect x="520" y="14" width="135" height="24" rx="12" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6,182,212,0.3)" />
    <text x="536" y="29" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">dvccorporation.lk</text>

    <!-- Content Split -->
    <!-- Left Metrics -->
    <g transform="translate(36, 80)">
      <text x="0" y="14" fill="#94a3b8" font-family="monospace" font-size="10" letter-spacing="1">VENTURE PORTFOLIO AUM</text>
      <text x="0" y="48" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="800">LKR 4.85 Billion</text>
      <text x="0" y="70" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold">▲ +24.8% YoY Capital Growth</text>

      <g transform="translate(0, 100)">
        <rect width="180" height="60" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" />
        <text x="16" y="24" fill="#64748b" font-family="sans-serif" font-size="10">Active Seed Ventures</text>
        <text x="16" y="47" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">18 Companies</text>
      </g>

      <g transform="translate(0, 175)">
        <rect width="180" height="60" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" />
        <text x="16" y="24" fill="#64748b" font-family="sans-serif" font-size="10">ESG &amp; Compliance</text>
        <text x="16" y="47" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="bold">Tier-1 Rating</text>
      </g>
    </g>

    <!-- Right Area Chart -->
    <g transform="translate(260, 80)">
      <rect width="380" height="255" rx="14" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)" />
      <text x="24" y="28" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">Fund Growth Performance</text>

      <!-- Chart Grid lines -->
      <line x1="24" y1="70" x2="356" y2="70" stroke="rgba(255,255,255,0.06)" />
      <line x1="24" y1="120" x2="356" y2="120" stroke="rgba(255,255,255,0.06)" />
      <line x1="24" y1="170" x2="356" y2="170" stroke="rgba(255,255,255,0.06)" />
      <line x1="24" y1="220" x2="356" y2="220" stroke="rgba(255,255,255,0.06)" />

      <!-- Area fill -->
      <path d="M 24 200 Q 90 180, 140 140 T 240 100 T 356 50 L 356 220 L 24 220 Z" fill="url(#chartGrad)" />

      <!-- Gradient Stroke -->
      <path d="M 24 200 Q 90 180, 140 140 T 240 100 T 356 50" fill="none" stroke="url(#purpleGrad)" stroke-width="3.5" stroke-linecap="round" />

      <!-- Data Dots -->
      <circle cx="140" cy="140" r="4.5" fill="#ffffff" stroke="#8b5cf6" stroke-width="2.5" />
      <circle cx="240" cy="100" r="4.5" fill="#ffffff" stroke="#06b6d4" stroke-width="2.5" />
      <circle cx="356" cy="50" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2.5" />
    </g>
  </g>
</svg>

