<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="eduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a" />
      <stop offset="50%" stop-color="#14122e" />
      <stop offset="100%" stop-color="#091321" />
    </linearGradient>
    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="eduBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#eduBg)" />

  <circle cx="200" cy="200" r="160" fill="#8b5cf6" opacity="0.2" filter="url(#eduBlur)" />
  <circle cx="600" cy="280" r="150" fill="#38bdf8" opacity="0.18" filter="url(#eduBlur)" />

  <g transform="translate(60, 50)">
    <rect width="680" height="370" rx="18" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

    <!-- Header -->
    <rect width="680" height="48" rx="18" fill="rgba(255,255,255,0.03)" />
    <circle cx="26" cy="24" r="4.5" fill="#ef4444" opacity="0.7" />
    <circle cx="42" cy="24" r="4.5" fill="#f59e0b" opacity="0.7" />
    <circle cx="58" cy="24" r="4.5" fill="#10b981" opacity="0.7" />
    
    <text x="82" y="28" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">EDUCATION PLATFORM &amp; REST BACKEND // MIT LICENSE</text>
    <rect x="520" y="14" width="130" height="22" rx="11" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56,189,248,0.3)" />
    <text x="536" y="29" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">OPEN SOURCE (MIT)</text>

    <!-- Split: Left Course Modules -->
    <g transform="translate(35, 75)">
      <text x="0" y="16" fill="#94a3b8" font-family="monospace" font-size="10">STUDENT CURRICULUM SYLLABUS</text>
      <text x="0" y="46" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">Software Engineering HNDIT</text>

      <!-- Module 1 -->
      <g transform="translate(0, 70)">
        <rect width="280" height="58" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
        <text x="16" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Module 01: Flutter &amp; State Management</text>
        <rect x="16" y="38" width="248" height="6" rx="3" fill="rgba(255,255,255,0.06)" />
        <rect x="16" y="38" width="210" height="6" rx="3" fill="url(#progGrad)" />
      </g>

      <!-- Module 2 -->
      <g transform="translate(0, 140)">
        <rect width="280" height="58" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
        <text x="16" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Module 02: PHP REST API Middleware</text>
        <rect x="16" y="38" width="248" height="6" rx="3" fill="rgba(255,255,255,0.06)" />
        <rect x="16" y="38" width="185" height="6" rx="3" fill="url(#progGrad)" />
      </g>

      <!-- Module 3 -->
      <g transform="translate(0, 210)">
        <rect width="280" height="58" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
        <text x="16" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Module 03: Relational DB Modeling</text>
        <rect x="16" y="38" width="248" height="6" rx="3" fill="rgba(255,255,255,0.06)" />
        <rect x="16" y="38" width="248" height="6" rx="3" fill="#10b981" />
      </g>
    </g>

    <!-- Split: Right Code Mockup Terminal -->
    <g transform="translate(345, 75)">
      <rect width="300" height="265" rx="12" fill="#020617" stroke="rgba(255,255,255,0.08)" />
      <rect width="300" height="32" rx="12" fill="rgba(255,255,255,0.04)" />
      <text x="16" y="21" fill="#64748b" font-family="monospace" font-size="10">course_controller.dart</text>

      <g transform="translate(16, 50)" font-family="monospace" font-size="10" fill="#94a3b8">
        <text y="16"><tspan fill="#f43f5e">import</tspan> &apos;package:flutter/material.dart&apos;;</text>
        <text y="38"><tspan fill="#f43f5e">class</tspan> <tspan fill="#38bdf8">QuizController</tspan> <tspan fill="#f43f5e">extends</tspan> GetxController {</text>
        <text y="60">  <tspan fill="#818cf8">final</tspan> score = 0.obs;</text>
        <text y="82">  <tspan fill="#818cf8">final</tspan> api = EducationApiService();</text>
        <text y="112">  <tspan fill="#818cf8">Future</tspan>&lt;void&gt; submitExam() <tspan fill="#f43f5e">async</tspan> {</text>
        <text y="134">    <tspan fill="#818cf8">await</tspan> api.postScore(score.value);</text>
        <text y="156">    Get.snackbar(<tspan fill="#a7f3d0">&apos;Passed&apos;</tspan>, <tspan fill="#a7f3d0">&apos;Score: 98%&apos;</tspan>);</text>
        <text y="178">  }</text>
        <text y="200">}</text>
      </g>
    </g>
  </g>
</svg>

