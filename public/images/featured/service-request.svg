<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="srBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070c1a" />
    </linearGradient>
    <filter id="srBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#srBg)" />

  <circle cx="200" cy="180" r="150" fill="#3b82f6" opacity="0.18" filter="url(#srBlur)" />
  <circle cx="620" cy="300" r="160" fill="#06b6d4" opacity="0.18" filter="url(#srBlur)" />

  <g transform="translate(60, 50)">
    <rect width="680" height="370" rx="18" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

    <!-- Top Bar -->
    <rect width="680" height="48" rx="18" fill="rgba(255,255,255,0.03)" />
    <circle cx="26" cy="24" r="4.5" fill="#ef4444" opacity="0.7" />
    <circle cx="42" cy="24" r="4.5" fill="#f59e0b" opacity="0.7" />
    <circle cx="58" cy="24" r="4.5" fill="#10b981" opacity="0.7" />
    
    <text x="82" y="28" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">MINI SERVICE REQUEST // ASYNCHRONOUS DISPATCH ENGINE</text>
    <text x="490" y="28" fill="#38bdf8" font-family="monospace" font-size="11">● DISPATCH LIVE</text>

    <!-- 3 Kanban Columns -->
    <!-- Col 1: Pending Requests -->
    <g transform="translate(30, 75)">
      <rect width="195" height="260" rx="12" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)" />
      <text x="16" y="24" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="bold">QUEUED (4)</text>

      <g transform="translate(12, 40)">
        <rect width="171" height="90" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
        <text x="12" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">HVAC Maintenance</text>
        <text x="12" y="38" fill="#94a3b8" font-family="sans-serif" font-size="10">Branch Office #04</text>
        <rect x="12" y="55" width="60" height="18" rx="4" fill="rgba(245,158,11,0.15)" />
        <text x="18" y="68" fill="#fbbf24" font-family="monospace" font-size="9">Urgent</text>
        <text x="110" y="68" fill="#64748b" font-family="monospace" font-size="9">#SR-102</text>
      </g>

      <g transform="translate(12, 145)">
        <rect width="171" height="90" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
        <text x="12" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Fiber Link Diagnostic</text>
        <text x="12" y="38" fill="#94a3b8" font-family="sans-serif" font-size="10">Data Center Bay 2</text>
        <rect x="12" y="55" width="60" height="18" rx="4" fill="rgba(56,189,248,0.15)" />
        <text x="22" y="68" fill="#38bdf8" font-family="monospace" font-size="9">Normal</text>
        <text x="110" y="68" fill="#64748b" font-family="monospace" font-size="9">#SR-103</text>
      </g>
    </g>

    <!-- Col 2: In-Progress -->
    <g transform="translate(242, 75)">
      <rect width="195" height="260" rx="12" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)" />
      <text x="16" y="24" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">DISPATCHED (2)</text>

      <g transform="translate(12, 40)">
        <rect width="171" height="90" rx="8" fill="rgba(56,189,248,0.06)" stroke="rgba(56,189,248,0.3)" />
        <text x="12" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Power Substation 12</text>
        <text x="12" y="38" fill="#94a3b8" font-family="sans-serif" font-size="10">Tech assigned: #481</text>
        <rect x="12" y="55" width="75" height="18" rx="4" fill="rgba(56,189,248,0.2)" />
        <text x="18" y="68" fill="#7dd3fc" font-family="monospace" font-size="9">In-Transit</text>
        <text x="110" y="68" fill="#64748b" font-family="monospace" font-size="9">#SR-098</text>
      </g>
    </g>

    <!-- Col 3: Completed -->
    <g transform="translate(454, 75)">
      <rect width="195" height="260" rx="12" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)" />
      <text x="16" y="24" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold">RESOLVED (18)</text>

      <g transform="translate(12, 40)">
        <rect width="171" height="90" rx="8" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.25)" />
        <text x="12" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">UPS Battery Array</text>
        <text x="12" y="38" fill="#94a3b8" font-family="sans-serif" font-size="10">Inspected &amp; Verified</text>
        <rect x="12" y="55" width="60" height="18" rx="4" fill="rgba(16,185,129,0.2)" />
        <text x="18" y="68" fill="#6ee7b7" font-family="monospace" font-size="9">Passed</text>
        <text x="110" y="68" fill="#64748b" font-family="monospace" font-size="9">#SR-094</text>
      </g>
    </g>
  </g>
</svg>

