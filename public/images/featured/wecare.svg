<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="wcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#120e29" />
      <stop offset="100%" stop-color="#041214" />
    </linearGradient>
    <linearGradient id="zenOrb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="wcBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#wcBg)" />

  <circle cx="240" cy="240" r="170" fill="#a855f7" opacity="0.22" filter="url(#wcBlur)" />
  <circle cx="560" cy="220" r="160" fill="#10b981" opacity="0.18" filter="url(#wcBlur)" />

  <!-- Left: Concentric Mindfulness Orb &amp; Pulse -->
  <g transform="translate(180, 240)">
    <circle cx="0" cy="0" r="130" fill="none" stroke="rgba(168, 85, 247, 0.2)" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="rgba(59, 130, 246, 0.3)" stroke-width="2" />
    <circle cx="0" cy="0" r="70" fill="none" stroke="rgba(16, 185, 129, 0.4)" stroke-width="2.5" />
    <circle cx="0" cy="0" r="45" fill="url(#zenOrb)" opacity="0.9" />

    <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">ZEN</text>
    <text x="0" y="160" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="11">MINDFULNESS PACER // 4-7-8 RHYTHM</text>
  </g>

  <!-- Right: Glassmorphic Mood Tracker &amp; Journal Card -->
  <g transform="translate(380, 75)">
    <rect width="360" height="320" rx="18" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

    <rect width="360" height="45" rx="18" fill="rgba(255,255,255,0.03)" />
    <text x="24" y="27" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="bold">WECARE // SENTIMENT ANALYTICS</text>
    <circle cx="330" cy="23" r="4.5" fill="#10b981" />

    <g transform="translate(24, 65)">
      <text x="0" y="16" fill="#94a3b8" font-family="sans-serif" font-size="11">Weekly Emotional Balance</text>
      <text x="0" y="45" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">88% Serenity Index</text>

      <!-- Sentiment Bar Row -->
      <g transform="translate(0, 70)">
        <text x="0" y="14" fill="#64748b" font-family="monospace" font-size="10">MOOD TREND</text>
        <g transform="translate(0, 24)">
          <rect x="0" y="0" width="38" height="60" rx="6" fill="rgba(168, 85, 247, 0.3)" />
          <rect x="46" y="10" width="38" height="50" rx="6" fill="rgba(168, 85, 247, 0.4)" />
          <rect x="92" y="20" width="38" height="40" rx="6" fill="rgba(6, 182, 212, 0.5)" />
          <rect x="138" y="5" width="38" height="55" rx="6" fill="rgba(16, 185, 129, 0.7)" />
          <rect x="184" y="0" width="38" height="60" rx="6" fill="rgba(16, 185, 129, 0.85)" />
          <rect x="230" y="12" width="38" height="48" rx="6" fill="rgba(16, 185, 129, 0.6)" />
          <rect x="274" y="0" width="38" height="60" rx="6" fill="#10b981" />
        </g>
      </g>

      <!-- Bottom Encrypted Badge -->
      <g transform="translate(0, 195)">
        <rect width="312" height="38" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
        <text x="14" y="24" fill="#34d399" font-family="monospace" font-size="10">🔒 Client-Side AES-256 Encrypted Private Journal</text>
      </g>
    </g>
  </g>
</svg>

